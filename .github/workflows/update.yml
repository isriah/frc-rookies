name: Update rookie list

on:
  schedule:
    - cron: '7,37 * * * *' # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rookies from the FRC Events API
        env:
          FRC_API_USERNAME: ${{ secrets.FRC_API_USERNAME }}
          FRC_API_TOKEN: ${{ secrets.FRC_API_TOKEN }}
          SEASON: ${{ vars.SEASON }}
        run: node scripts/update.mjs

      - name: Commit data changes
        run: |
          git add site/data cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update rookie data"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
