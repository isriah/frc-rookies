name: Update rookie list

on:
  schedule:
    # Every 15 minutes at off-peak minutes. GitHub skips many scheduled runs,
    # so asking more often is what keeps the real gap short.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      events:
        description: Event registrations (auto = only when about 3 hours old)
        type: choice
        options: [always, auto]
        default: always
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'cache/**', 'locations/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rookies from the FRC Events API
        env:
          FRC_API_USERNAME: ${{ secrets.FRC_API_USERNAME }}
          FRC_API_TOKEN: ${{ secrets.FRC_API_TOKEN }}
          SEASON: ${{ vars.SEASON }}
          # Pushes and manual runs refresh event registrations; scheduled runs
          # and the outside timer (trigger/) leave it to the updater's 3-hour rule
          EVENTS: ${{ github.event_name == 'push' && 'always' || inputs.events || '' }}
        run: node scripts/update.mjs

      - name: Commit data changes
        run: |
          git add site/data cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update rookie data"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes can't find the artifact a second after it was uploaded,
      # so a failed deploy is tried once more after a short wait.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - id: redeploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
