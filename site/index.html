<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRC Rookie Teams</title>
<link rel="alternate" type="application/atom+xml" title="New FRC rookie teams" href="feed.xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="color-strip"><i></i><i></i><i></i></div>
<nav>
  <div class="container">
    <span class="brand">FRC Rookie Teams<small>Unofficial</small></span>
    <span class="navlinks"><a href="./" aria-current="page">List</a><a href="map.html">Map</a></span>
    <input type="search" id="q" placeholder="Team #, name, city, event" aria-label="Search teams">
  </div>
</nav>
<main>
<div class="container sheet">
  <div class="titlebar">
    <h1 id="title">FRC Rookie Teams</h1>
    <p class="sub" id="status">Loading…</p>
  </div>
  <div class="content">
  <div class="stats" id="stats"></div>

  <div class="controls">
    <select id="country" aria-label="Country"><option value="">All countries</option></select>
    <select id="state" aria-label="State or province"><option value="">All states/provinces</option></select>
    <select id="district" aria-label="FIRST district"><option value="">All districts</option></select>
    <label class="chk"><input type="checkbox" id="onlyNew"> New only</label>
    <label class="chk"><input type="checkbox" id="hideRemoved" checked> Hide removed</label>
    <button id="csv" type="button">Download CSV</button>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="number">Team</th>
          <th data-sort="name">Name</th>
          <th data-sort="city">City</th>
          <th data-sort="state">State/Prov</th>
          <th data-sort="country" class="hide-sm">Country</th>
          <th data-sort="eventCount">Events</th>
          <th data-sort="firstSeen">First seen</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No teams match.</div>
  </div>
  </div>
  <p class="fineprint">Unofficial: not affiliated with <i>FIRST</i>. Data from the official <a href="https://frc-events.firstinspires.org/services/API">FRC Events API</a>, checked up to four times an hour. <a href="feed.xml">Atom feed</a> · <a href="data/teams.json">JSON</a></p>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const VISIT_KEY = 'frc-rookies-last-visit';
let teams = [], season = '', sortKey = 'number', sortDir = 1, newSince = 0;

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
const fmtDateTime = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const isNew = (t) => !t.removed && t.firstSeen && Date.parse(t.firstSeen) > newSince;

function filtered() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const country = $('country').value, state = $('state').value, district = $('district').value, onlyNew = $('onlyNew').checked, hideRemoved = $('hideRemoved').checked;
  const list = teams.filter((t) =>
    (!country || t.country === country) &&
    (!state || t.state === state) &&
    (!district || (district === NO_DISTRICT ? !t.district : t.district === district)) &&
    (!onlyNew || isNew(t)) &&
    (!hideRemoved || !t.removed) &&
    words.every((w) => t._search.includes(w)));
  const cmp = (a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (typeof x === 'number' && typeof y === 'number') return x - y || a.number - b.number;
    if (!x !== !y) return x ? -1 : 1; // blanks last either direction
    return String(x ?? '').localeCompare(String(y ?? ''), undefined, { sensitivity: 'base' }) || a.number - b.number;
  };
  return list.sort((a, b) => {
    if (sortKey !== 'number' && !a[sortKey] !== !b[sortKey]) return a[sortKey] ? -1 : 1;
    return sortDir * cmp(a, b);
  });
}

const shortDay = (iso) => new Date(iso + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

function eventsCell(t) {
  const td = el('td', { className: 'events' });
  for (const e of t.events) {
    const when = e.start ? shortDay(e.start) : '';
    const where = [e.city, e.state, e.country].filter(Boolean).join(', ');
    td.append(el('div', { title: [e.name, where, e.start && e.end ? `${e.start} to ${e.end}` : ''].filter(Boolean).join(' · ') },
      el('a', { href: `https://frc-events.firstinspires.org/${season}/${e.code}`, textContent: e.name || e.code, rel: 'noopener' }),
      when ? el('span', { textContent: ' ' + when }) : ''));
  }
  return td;
}

function render() {
  const list = filtered();
  const rows = list.map((t) => {
    const nameLine = el('div', { className: 'nameline' }, el('b', { textContent: t.name || '(unnamed)' }));
    const nameCell = el('td', { className: 'name' }, nameLine);
    if (isNew(t)) nameLine.append(el('span', { className: 'badge new', textContent: 'NEW' }));
    if (t.removed) nameLine.append(el('span', { className: 'badge gone', textContent: 'REMOVED', title: t.note || 'No longer listed since ' + fmtDate(t.removed) }));
    if (t.sponsors && t.sponsors !== t.name) nameCell.append(el('div', { className: 'sponsors', textContent: t.sponsors, title: t.sponsors }));
    const tr = el('tr', { className: t.removed ? 'removed' : '' },
      el('td', { className: 'num' }, el('a', { href: `https://frc-events.firstinspires.org/${season}/team/${t.number}`, textContent: t.number, rel: 'noopener' })),
      nameCell,
      el('td', { textContent: t.city }),
      el('td', { textContent: t.state }),
      el('td', { textContent: t.country, className: 'hide-sm' }),
      eventsCell(t),
      el('td', { className: 'seen', textContent: t.firstSeen ? fmtDate(t.firstSeen) : '—', title: t.firstSeen ? fmtDateTime(t.firstSeen) : 'Listed before tracking began' }));
    return tr;
  });
  $('rows').replaceChildren(...rows);
  $('empty').hidden = rows.length > 0;
  document.querySelectorAll('th[data-sort]').forEach((th) => {
    if (th.dataset.sort === sortKey) th.setAttribute('aria-sort', sortDir > 0 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  });
}

function fillSelect(sel, values, allLabel) {
  const keep = sel.value;
  sel.replaceChildren(el('option', { value: '', textContent: allLabel }),
    ...values.map(([v, n]) => el('option', { value: v, textContent: `${v} (${n})` })));
  sel.value = values.some(([v]) => v === keep) ? keep : '';
}

function counts(list, key) {
  const m = new Map();
  for (const t of list) if (t[key]) m.set(t[key], (m.get(t[key]) || 0) + 1);
  return [...m].sort((a, b) => a[0].localeCompare(b[0]));
}

// FIRST district codes as the API gives them; unknown codes show as the code.
const DISTRICT_NAMES = { CA: 'California', FCH: 'Chesapeake', FIM: 'Michigan', FIN: 'Indiana', FMA: 'Mid-Atlantic',
  FNC: 'North Carolina', FSC: 'South Carolina', ISR: 'Israel', NE: 'New England', ONT: 'Ontario', PCH: 'Peachtree',
  PNW: 'Pacific Northwest', TX: 'Texas', WIN: 'Wisconsin' };
const NO_DISTRICT = '-';

function fillDistricts(active) {
  const named = counts(active, 'district').map(([code, n]) => [code, `${DISTRICT_NAMES[code] ?? code} (${n})`]);
  named.sort((a, b) => a[1].localeCompare(b[1]));
  const none = active.filter((t) => !t.district).length;
  $('district').replaceChildren(el('option', { value: '', textContent: 'All districts' }),
    ...named.map(([value, textContent]) => el('option', { value, textContent })),
    el('option', { value: NO_DISTRICT, textContent: `Not in a district (${none})` }));
}

function fillStates() {
  // Only offered once a country is chosen, and only if that country's teams
  // span more than one state/province. Always starts cleared.
  const c = $('country').value, sel = $('state');
  const states = c ? counts(teams.filter((t) => !t.removed && t.country === c), 'state') : [];
  fillSelect(sel, states, 'All states/provinces');
  sel.value = '';
  sel.hidden = states.length < 2;
}

function csv() {
  const cols = ['number', 'name', 'sponsors', 'school', 'city', 'state', 'country', 'district', 'eventCodes', 'firstSeen', 'removed'];
  const cell = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // stop spreadsheets treating names as formulas
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const text = [cols.join(','), ...filtered().map((t) => cols.map((c) => cell(t[c])).join(','))].join('\r\n');
  const a = el('a', { href: URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })), download: `frc-rookies-${season}.csv` });
  a.click();
  URL.revokeObjectURL(a.href);
}

async function load() {
  let data, meta = null, reg = null;
  try {
    const res = await fetch('data/teams.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    reg = await fetch('data/events.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    meta = await fetch('data/meta.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  } catch {
    $('status').textContent = 'Could not load team data.';
    return;
  }
  season = data.season;
  const sameSeason = reg && reg.season === season;
  teams = data.teams.map((t) => {
    const codes = (sameSeason && !t.removed && reg.teams[t.number]) || [];
    const events = codes.filter((c) => reg.events[c]).map((c) => ({ code: c, ...reg.events[c] }));
    return { ...t, events, eventCount: events.length, eventCodes: codes.join(' '),
      _search: [t.number, t.name, t.sponsors, t.school, t.city, t.state, t.country, t.district,
        ...events.flatMap((e) => [e.code, e.name])].join(' ').toLowerCase() };
  });

  // "New" = first seen since your previous visit, or in the last 3 days on a first visit.
  let last = 0;
  try { last = Number(localStorage.getItem(VISIT_KEY)) || 0; localStorage.setItem(VISIT_KEY, Date.now()); } catch {}
  newSince = last || Date.now() - 3 * 864e5;

  const active = teams.filter((t) => !t.removed);
  document.title = $('title').textContent = `${season} FRC Rookie Teams`;
  $('status').textContent = meta?.lastChecked ? `Last checked ${fmtDateTime(meta.lastChecked)}` : '';
  const week = Date.now() - 7 * 864e5;
  const stat = (n, label) => el('div', { className: 'stat' }, el('b', { textContent: n }), el('span', { textContent: label }));
  $('stats').replaceChildren(
    stat(active.length, 'rookie teams'),
    stat(new Set(active.map((t) => t.country).filter(Boolean)).size, 'countries'),
    stat(active.filter((t) => t.eventCount).length, 'registered for an event'),
    stat(active.filter((t) => t.firstSeen && Date.parse(t.firstSeen) > week).length, 'added in last 7 days'),
    stat(active.filter(isNew).length, last ? 'new since your last visit' : 'new in last 3 days'));
  fillSelect($('country'), counts(active, 'country'), 'All countries');
  fillDistricts(active);
  fillStates();
  render();
}

$('q').addEventListener('input', render);
$('onlyNew').addEventListener('change', render);
$('hideRemoved').addEventListener('change', render);
$('state').addEventListener('change', render);
$('district').addEventListener('change', render);
$('country').addEventListener('change', () => { fillStates(); render(); });
$('csv').addEventListener('click', csv);
document.querySelectorAll('th[data-sort]').forEach((th) => th.addEventListener('click', () => {
  if (sortKey === th.dataset.sort) sortDir = -sortDir;
  else { sortKey = th.dataset.sort; sortDir = sortKey === 'firstSeen' || sortKey === 'eventCount' ? -1 : 1; }
  render();
}));
load();
</script>
</body>
</html>
